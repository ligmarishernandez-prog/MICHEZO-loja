<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michezo — Meu Carrinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a16;
    --terracotta:#b5502e;
    --terracotta-dark:#8f3d22;
    --olive:#4a4a2a;
    --paper:#f3ede1;
    --gold:#d9a441;
    --line: rgba(28,26,22,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background:#fff;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:0.02em; }
  .mono{ font-family:'JetBrains Mono', monospace; letter-spacing:0.02em; }

  /* TOP BAR */
  .topbar{ background:var(--ink); color:#e9e4d8; font-family:'JetBrains Mono', monospace; font-size:12px; }
  .topbar-inner{ max-width:1240px; margin:0 auto; padding:8px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .topbar-left{ display:flex; gap:20px; align-items:center; opacity:0.85; }
  .topbar-left a{ color:inherit; text-decoration:none; }
  .topbar-right{ display:flex; gap:14px; }
  .topbar-right a{ color:#e9e4d8; text-decoration:none; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(233,228,216,0.3); border-radius:50%; transition:all .2s ease; }
  .topbar-right a:hover{ background:var(--terracotta); border-color:var(--terracotta); }

  /* MAIN NAV */
  header.mainnav{ background:linear-gradient(180deg, var(--terracotta) 0%, var(--terracotta-dark) 100%); color:#fff; position:relative; }
  header.mainnav::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:6px; background-image:repeating-linear-gradient(45deg, rgba(0,0,0,0.15) 0 8px, transparent 8px 16px); }
  .nav-inner{ max-width:1240px; margin:0 auto; padding:20px 24px 26px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .logo{ display:flex; align-items:center; gap:12px; }
  .logo-mark{ width:44px; height:44px; border:2px solid #fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Anton', sans-serif; font-size:20px; flex-shrink:0; }
  .logo-text{ font-family:'Anton', sans-serif; font-size:24px; letter-spacing:0.16em; line-height:1; }
  .search{ flex:1 1 320px; max-width:420px; position:relative; }
  .search input{ width:100%; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.35); border-radius:999px; padding:11px 44px 11px 18px; color:#fff; font-size:14px; }
  .search input::placeholder{ color:rgba(255,255,255,0.7); }
  .search input:focus{ outline:2px solid #fff; outline-offset:2px; background:rgba(255,255,255,0.22); }
  .search svg{ position:absolute; right:16px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:0.85; }
  nav.links{ display:flex; gap:28px; align-items:center; font-size:13px; font-weight:600; letter-spacing:0.06em; }
  nav.links a{ color:#fff; text-decoration:none; opacity:0.82; padding-bottom:4px; border-bottom:2px solid transparent; transition:all .2s ease; text-transform:uppercase; }
  nav.links a:hover, nav.links a.active{ opacity:1; border-color:var(--gold); }
  .nav-actions{ display:flex; gap:28px; align-items:center; }
  .nav-action{ display:flex; flex-direction:column; align-items:center; gap:4px; color:#fff; text-decoration:none; font-size:10.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; opacity:0.9; background:none; border:none; cursor:pointer; font-family:inherit; position:relative; }
  .nav-action.active{ opacity:1; }
  .nav-action.active svg{ stroke:var(--gold); }
  .nav-action svg{ width:22px; height:22px; }
  .cart-count{ position:absolute; top:-6px; right:-10px; background:var(--gold); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  /* PAGE */
  .page{ max-width:1120px; margin:0 auto; padding:44px 24px 100px; }
  .breadcrumb{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.08em;
    color:var(--terracotta-dark); text-transform:uppercase; margin-bottom:10px;
  }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:30px; flex-wrap:wrap; }
  .page-head h1{ font-size:clamp(26px,3.4vw,38px); }
  .item-tally{ font-family:'JetBrains Mono', monospace; font-size:12.5px; opacity:0.7; }

  .cart-layout{ display:grid; grid-template-columns:1fr 340px; gap:36px; align-items:start; }
  @media (max-width:860px){ .cart-layout{ grid-template-columns:1fr; } }

  .cart-list-head{
    display:grid; grid-template-columns:36px 90px 1fr 130px 110px 34px;
    gap:14px; align-items:center;
    padding:0 4px 12px; border-bottom:2px solid var(--ink);
    font-family:'JetBrains Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.6;
  }
  @media (max-width:640px){ .cart-list-head{ display:none; } }

  .cart-row{
    display:grid; grid-template-columns:36px 90px 1fr 130px 110px 34px;
    gap:14px; align-items:center;
    padding:18px 4px; border-bottom:1px solid var(--line);
    transition: background .2s ease;
  }
  .cart-row.selected{ background: rgba(181,80,46,0.05); }
  @media (max-width:640px){
    .cart-row{ grid-template-columns:32px 70px 1fr; grid-template-areas:"chk img info" "chk img price" "chk img qty"; row-gap:8px; }
    .cart-row .price-cell{ grid-area:price; }
    .cart-row .qty-cell{ grid-area:qty; }
    .cart-row .remove-cell{ grid-area:qty; justify-self:end; }
    .cart-row .chk-cell{ grid-area:chk; }
    .cart-row .img-cell{ grid-area:img; }
    .cart-row .info-cell{ grid-area:info; }
  }

  .check{
    width:19px; height:19px; border:1.5px solid var(--ink); border-radius:3px;
    cursor:pointer; accent-color: var(--terracotta);
  }
  .img-cell img{ width:90px; height:90px; object-fit:contain; background:var(--paper); border-radius:4px; }
  .info-cell .n{ font-size:13.5px; font-weight:600; line-height:1.4; margin-bottom:4px; }
  .info-cell .unit{ font-family:'JetBrains Mono', monospace; font-size:11.5px; opacity:0.6; }
  .price-cell{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13.5px; }
  .qty-cell .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{
    width:24px; height:24px; border-radius:4px; border:1px solid var(--ink);
    background:#fff; cursor:pointer; font-family:'JetBrains Mono', monospace;
    font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .stepper button:hover{ background:var(--ink); color:#fff; }
  .stepper span{ font-family:'JetBrains Mono', monospace; font-size:13px; min-width:14px; text-align:center; }
  .remove-cell button{
    background:none; border:none; cursor:pointer; opacity:0.4; transition:opacity .2s ease, color .2s ease;
    color:var(--ink);
  }
  .remove-cell button:hover{ opacity:1; color:var(--terracotta); }

  .empty-state{
    text-align:center; padding:70px 20px; border:1px dashed var(--line);
  }
  .empty-state p{ font-family:'JetBrains Mono', monospace; font-size:13px; opacity:0.65; margin-bottom:18px; }
  .empty-state a{
    display:inline-block; background:var(--terracotta); color:#fff; text-decoration:none;
    padding:11px 22px; border-radius:999px; font-weight:700; font-size:13px; text-transform:uppercase;
  }

  .continue-row{ margin-top:22px; }
  .continue-row a{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink); text-decoration:none;
    display:inline-flex; align-items:center; gap:6px; opacity:0.75;
  }
  .continue-row a:hover{ opacity:1; }

  /* SUMMARY SIDEBAR */
  .summary{
    border:1px solid var(--ink);
    position:sticky; top:24px;
  }
  .summary-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px; border-bottom:1px solid var(--line);
  }
  .summary-head h3{ font-size:15px; font-weight:700; }
  .summary-hint{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--terracotta-dark); }
  .summary-hint.ok{ color:var(--olive); }
  .summary-list{ max-height:220px; overflow-y:auto; }
  .summary-item{
    display:flex; justify-content:space-between; padding:10px 18px;
    font-size:12.5px; border-bottom:1px dashed var(--line); gap:10px;
  }
  .summary-item span:first-child{ flex:1; }
  .summary-item span:last-child{ font-family:'JetBrains Mono', monospace; white-space:nowrap; }
  .summary-rows{ padding:14px 18px 0; }
  .row-line{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; }
  .row-line span:last-child{ font-family:'JetBrains Mono', monospace; }
  .row-line.muted{ opacity:0.65; }
  .select-all-row{
    display:flex; align-items:center; gap:8px; padding:14px 18px; border-top:1px solid var(--line);
    font-size:13px; font-weight:600;
  }
  .summary-foot{ padding:16px 18px; border-top:1px solid var(--ink); }
  .total-line{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .total-line span:first-child{ font-family:'JetBrains Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.6; }
  .total-price{ font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:700; }
  .buy-btn{
    width:100%; background:var(--terracotta); color:#fff; border:none; padding:13px;
    font-family:'Work Sans', sans-serif; font-weight:700; letter-spacing:0.03em;
    border-radius:999px; cursor:pointer; text-transform:uppercase; font-size:13px;
    transition:background .2s ease;
  }
  .buy-btn:hover{ background:var(--terracotta-dark); }
  .buy-btn:disabled{ background:#c9c2b3; cursor:not-allowed; }
  .cupom{
    display:flex; gap:6px; padding:0 18px 16px;
  }
  .cupom input{
    flex:1; border:1px solid var(--line); padding:9px 10px; font-size:12px; font-family:'Work Sans', sans-serif;
  }
  .cupom button{
    border:1px solid var(--ink); background:#fff; padding:0 14px; font-size:11px;
    font-family:'JetBrains Mono', monospace; text-transform:uppercase; cursor:pointer;
  }
  .cupom button:hover{ background:var(--ink); color:#fff; }

  footer{ background:var(--olive); height:60px; margin-top:60px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; transition:all .3s ease; z-index:60;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <span>🇧🇷 (41) 98556-6333</span>
      <a href="mailto:lojamichezo@gmail.com">lojamichezo@gmail.com</a>
    </div>
    <div class="topbar-right">
      <a href="#" aria-label="Instagram"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
      <a href="#" aria-label="Facebook"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
    </div>
  </div>
</div>

<header class="mainnav">
  <div class="nav-inner">
    <div class="logo">
      <div class="logo-mark">M</div>
      <div class="logo-text">MICHEZO</div>
    </div>
    <div class="search">
      <input type="text" placeholder="O que você está procurando?">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <nav class="links">
      <a href="index.html">Início</a>
      <a href="#">Informações</a>
      <a href="produtos.html">Produtos</a>
    </nav>
    <div class="nav-actions">
      <button class="nav-action" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
        Minha conta
      </button>
      <button class="nav-action active" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 7H6"/></svg>
        Meu carrinho
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<div class="page">
  <div class="breadcrumb">Início / Carrinho</div>
  <div class="page-head">
    <h1 class="display">Meu carrinho</h1>
    <span class="item-tally" id="tally">0 itens no carrinho</span>
  </div>

  <div class="cart-layout">
    <div>
      <div class="cart-list-head">
        <span></span><span>Produto</span><span></span><span>Preço</span><span>Qtd.</span><span></span>
      </div>
      <div id="cartList"></div>
      <div class="continue-row">
        <a href="#">&larr; Continuar comprando</a>
      </div>
    </div>

    <div class="summary">
      <div class="summary-head">
        <h3>Resumo de compras</h3>
        <span class="summary-hint" id="hint">Nenhum item selecionado?</span>
      </div>
      <div class="summary-list" id="summaryList"></div>
      <div class="cupom">
        <input type="text" placeholder="Cupom de desconto">
        <button id="applyCupom">Aplicar</button>
      </div>
      <div class="select-all-row">
        <input type="checkbox" class="check" id="selectAll">
        <label for="selectAll">Selecionar tudo</label>
      </div>
      <div class="summary-foot">
        <div class="total-line">
          <span>Total</span>
          <span class="total-price" id="totalPrice">R$ 00,00</span>
        </div>
        <button class="buy-btn" id="buyBtn" disabled>Comprar</button>
      </div>
    </div>
  </div>
</div>

<footer></footer>

<div class="toast" id="toast">Pedido confirmado ✓</div>

<script>
let cart = [
  { id:1, name:"Nutrex Research Creatine Monohydrate. 300g", price:130, qty:1, selected:true, img:"https://images.unsplash.com/photo-1594381898411-846e7d193883?w=300&q=80" },
  { id:2, name:"Conjunto fitness confeccionado em poliamida premium com elastano.", price:160, qty:1, selected:true, img:"https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=300&q=80" },
  { id:3, name:"Tênis Nike Renew In-Season TR", price:130, qty:1, selected:false, img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&q=80" },
  { id:4, name:"Whey Protein Isolado Baunilha 900g", price:175, qty:2, selected:true, img:"https://images.unsplash.com/photo-1579722820930-33b25ba6cb2b?w=300&q=80" },
];

const cartList = document.getElementById('cartList');
const summaryList = document.getElementById('summaryList');
const hint = document.getElementById('hint');
const totalPrice = document.getElementById('totalPrice');
const buyBtn = document.getElementById('buyBtn');
const selectAll = document.getElementById('selectAll');
const cartCount = document.getElementById('cartCount');
const tally = document.getElementById('tally');
const toast = document.getElementById('toast');

function money(v){ return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }

function renderList(){
  tally.textContent = `${cart.reduce((s,i)=>s+i.qty,0)} itens no carrinho`;

  if(!cart.length){
    cartList.innerHTML = `
      <div class="empty-state">
        <p>Seu carrinho está vazio.</p>
        <a href="#">Ver produtos</a>
      </div>`;
  }else{
    cartList.innerHTML = cart.map(i => `
      <div class="cart-row ${i.selected ? 'selected' : ''}" data-id="${i.id}">
        <div class="chk-cell"><input type="checkbox" class="check" data-id="${i.id}" ${i.selected ? 'checked' : ''}></div>
        <div class="img-cell"><img src="${i.img}" alt="${i.name}"></div>
        <div class="info-cell">
          <div class="n">${i.name}</div>
          <div class="unit">Unid. ${money(i.price)}</div>
        </div>
        <div class="price-cell">${money(i.price * i.qty)}</div>
        <div class="qty-cell">
          <div class="stepper">
            <button class="dec" data-id="${i.id}">−</button>
            <span>${i.qty}</span>
            <button class="inc" data-id="${i.id}">+</button>
          </div>
        </div>
        <div class="remove-cell"><button data-id="${i.id}" aria-label="Remover">✕</button></div>
      </div>
    `).join('');
  }
}

function renderSummary(){
  const selected = cart.filter(i => i.selected);
  cartCount.textContent = cart.reduce((s,i)=>s+i.qty,0);

  if(!selected.length){
    hint.textContent = 'Nenhum item selecionado?';
    hint.classList.remove('ok');
    summaryList.innerHTML = '';
    buyBtn.disabled = true;
  }else{
    hint.textContent = `${selected.length} item(ns) selecionado(s)`;
    hint.classList.add('ok');
    summaryList.innerHTML = selected.map(i => `
      <div class="summary-item">
        <span>${i.name} × ${i.qty}</span>
        <span>${money(i.price * i.qty)}</span>
      </div>
    `).join('');
    buyBtn.disabled = false;
  }

  const total = selected.reduce((s,i)=>s + i.price * i.qty, 0);
  totalPrice.textContent = money(total);

  selectAll.checked = cart.length > 0 && cart.every(i => i.selected);
}

function renderAll(){ renderList(); renderSummary(); }

cartList.addEventListener('click', e=>{
  const inc = e.target.closest('.inc');
  const dec = e.target.closest('.dec');
  const rm  = e.target.closest('.remove-cell button');
  const chk = e.target.closest('input.check');

  if(inc){
    const item = cart.find(i=>i.id==inc.dataset.id);
    item.qty++;
    renderAll();
  }else if(dec){
    const item = cart.find(i=>i.id==dec.dataset.id);
    item.qty = Math.max(1, item.qty - 1);
    renderAll();
  }else if(rm){
    cart = cart.filter(i=>i.id!=rm.dataset.id);
    renderAll();
  }else if(chk){
    const item = cart.find(i=>i.id==chk.dataset.id);
    item.selected = chk.checked;
    renderAll();
  }
});

selectAll.addEventListener('change', ()=>{
  cart.forEach(i => i.selected = selectAll.checked);
  renderAll();
});

document.getElementById('applyCupom').addEventListener('click', ()=>{
  toast.textContent = 'Cupom inválido ou expirado';
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2000);
});

buyBtn.addEventListener('click', ()=>{
  toast.textContent = 'Pedido confirmado ✓';
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2000);
});

renderAll();
</script>
</body>
</html>
