<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MICHEZO — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --terracota:#bd5b34;
    --terracota-claro:#d97a4f;
    --verde-escuro:#2f3a1f;
    --tinta:#1c1a16;
    --cinza:#8b8781;
    --linha:#e4e0d8;
    --branco:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--tinta);
    min-height:100vh;
    display:flex;
    background:var(--branco);
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;}

  .screen{
    display:flex;
    width:100%;
    min-height:100vh;
  }

  /* ===== LADO ESQUERDO — IMAGEM ===== */
  .side-visual{
    flex:1;
    position:relative;
    overflow:hidden;
    min-height:100vh;
  }
  .side-visual img{
    width:100%;height:100%;
    object-fit:cover;
    position:absolute;inset:0;
  }
  .side-visual::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(20,16,10,0.15) 0%, rgba(20,16,10,0.05) 40%, rgba(20,16,10,0.55) 100%);
  }
  .side-quote{
    position:absolute;
    top:12%;
    left:8%;
    right:10%;
    z-index:3;
    color:#fff;
    font-family:'Caveat',cursive;
    font-size:clamp(26px,2.6vw,38px);
    line-height:1.35;
    text-shadow:0 3px 10px rgba(0,0,0,0.35);
    transform:rotate(-2deg);
  }

  /* ===== LADO DIREITO — FORMULÁRIO ===== */
  .side-form{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 40px;
    position:relative;
  }
  .form-inner{
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* Logo */
  .brand-mark{
    width:100px;height:100px;
    position:relative;
    margin-bottom:14px;
  }
  .brand-mark svg{width:100%;height:100%;display:block;}

  .brand-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px;
    letter-spacing:11px;
    padding-left:11px;
    color:var(--tinta);
    margin-bottom:38px;
  }

  /* Campos */
  .field{
    width:100%;
    position:relative;
    margin-bottom:16px;
  }
  .field input{
    width:100%;
    height:52px;
    border:1.5px solid var(--linha);
    border-radius:10px;
    padding:0 46px;
    font-size:14px;
    color:var(--tinta);
    outline:none;
    transition:border-color .2s, box-shadow .2s;
    background:var(--branco);
  }
  .field input::placeholder{color:#a9a49b;}
  .field input:focus{
    border-color:var(--terracota);
    box-shadow:0 0 0 4px rgba(189,91,52,0.12);
  }
  .field .icon-left{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    color:#a9a49b;font-size:16px;pointer-events:none;
  }
  .field .icon-right{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:transparent;color:#a9a49b;font-size:16px;
    padding:6px;line-height:1;
  }
  .field .icon-right:hover{color:var(--terracota);}

  .remember-row{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    color:var(--cinza);
    margin:2px 0 26px;
  }
  .remember-row label{
    display:flex;align-items:center;gap:7px;cursor:pointer;
  }
  .remember-row input[type="checkbox"]{
    accent-color:var(--terracota);
    width:14px;height:14px;
    cursor:pointer;
  }
  .top-links{
    width:100%;
    display:flex;
    justify-content:flex-end;
    gap:20px;
    margin-bottom:25px;
    font-size:14px;
}

.top-links a{
    text-decoration:none;
    color:#1c1a16;
    font-weight:600;
    transition:.3s;
}

.top-links a:hover{
    color:#bd5b34;
}

  /* Botão Login */
  .btn-login{
    width:100%;
    height:54px;
    border-radius:30px;
    background:linear-gradient(180deg, var(--terracota-claro), var(--terracota));
    color:#fff;
    font-family:'Bebas Neue',sans-serif;
    font-size:20px;
    letter-spacing:3px;
    box-shadow:0 10px 22px rgba(189,91,52,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform .2s, box-shadow .2s;
  }
  .btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 26px rgba(189,91,52,0.45);
  }
  .btn-login:active{transform:translateY(0);}
  .btn-login.loading{pointer-events:none;opacity:.85;}

  .link-row{
    display:flex;
    gap:12px;
    margin-top:22px;
  }
  .pill-link{
    padding:9px 20px;
    background:var(--terracota);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:.6px;
    border-radius:20px;
    transition:background .2s, transform .2s;
  }
  .pill-link:hover{background:var(--verde-escuro);transform:translateY(-2px);}
  .pill-link.ghost{
    background:transparent;
    border:1.5px solid var(--terracota);
    color:var(--terracota);
  }
  .pill-link.ghost:hover{background:var(--terracota);color:#fff;}

  .divider-row{
    display:flex;align-items:center;gap:12px;
    width:100%;margin:30px 0 20px;
    color:#c9c4ba;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  }
  .divider-row::before,.divider-row::after{
    content:'';flex:1;height:1px;background:var(--linha);
  }

  .signup-note{
    font-size:13px;color:var(--cinza);
  }
  .signup-note a{color:var(--terracota);font-weight:700;}
  .signup-note a:hover{text-decoration:underline;}

  .error-msg{
    width:100%;
    background:#fdecea;
    color:#a83c2b;
    font-size:12px;
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:16px;
    display:none;
    text-align:left;
  }
  .error-msg.show{display:block;}

  /* ===== RESPONSIVO ===== */
  @media (max-width:900px){
    .side-visual{display:none;}
    .side-form{padding:40px 24px;}
  }

  :focus-visible{outline:3px solid var(--terracota-claro);outline-offset:2px;}
</style>
</head>
<body>

<div class="screen">

  <!-- LADO ESQUERDO -->
  <div class="side-visual">
    <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=1200&auto=format&fit=crop" alt="Padrões africanos com folhagem tropical">
    <div class="side-quote">A força da diversidade<br>em movimento.</div>
  </div>

  <!-- LADO DIREITO -->
  <div class="side-form">
    <div class="form-inner">
          <!-- Menu Superior -->
       <div class="top-links">
          <a href="index.html">Início</a>
          <a href="cadastro.html">Cadastro</a>
          <a href="#">Esqueci a senha</a>
       </div>

      <div class="brand-mark">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <!-- listras laterais decorativas -->
          <g fill="#1c1a16">
            <rect x="8" y="30" width="4" height="6"/>
            <rect x="8" y="40" width="4" height="6"/>
            <rect x="8" y="50" width="4" height="6"/>
            <rect x="8" y="60" width="4" height="6"/>
            <rect x="8" y="70" width="4" height="6"/>
            <rect x="15" y="34" width="4" height="6"/>
            <rect x="15" y="44" width="4" height="6"/>
            <rect x="15" y="54" width="4" height="6"/>
            <rect x="15" y="64" width="4" height="6"/>
          </g>
          <!-- M principal -->
          <path d="M28 92 L28 24 L60 60 L92 24 L92 92 L78 92 L78 50 L60 72 L42 50 L42 92 Z" fill="#1c1a16"/>
          <!-- v vermelho de destaque -->
          <path d="M46 60 L60 78 L74 60 L64 60 L60 66 L56 60 Z" fill="#bd5b34"/>
        </svg>
      </div>
      <div class="brand-name">MICHEZO</div>

      <div class="error-msg" id="errorMsg">E-mail/usuário ou senha incorretos. Tente novamente.</div>

      <form id="loginForm" style="width:100%;">
        <div class="field">
          <span class="icon-left">&#128100;</span>
          <input type="text" id="userInput" placeholder="E-mail ou nome de usuário" required autocomplete="username">
        </div>
        <div class="field">
          <span class="icon-left">&#128274;</span>
          <input type="password" id="passInput" placeholder="Senha" required autocomplete="current-password">
          <button type="button" class="icon-right" id="toggleEye" aria-label="Mostrar senha">&#128065;</button>
        </div>

        <div class="remember-row">
          <label><input type="checkbox">Lembrar de mim</label>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">LOGIN</button>
      </form>

      <div class="link-row">
        <a href="#" class="pill-link ghost">Esqueceu a senha?</a>
        <a href="cadastro.html" class="pill-link">Cadastro</a>
      </div>

      <div class="divider-row">ou continue com</div>
      <p class="signup-note">Ainda não tem conta? <a href="cadastro.html">Crie agora</a></p>

    </div>
  </div>

</div>

<script>
  const passInput = document.getElementById('passInput');
  const toggleEye = document.getElementById('toggleEye');
  toggleEye.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    toggleEye.innerHTML = isPass ? '&#128064;' : '&#128065;';
  });

  const form = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');
    loginBtn.classList.add('loading');
    loginBtn.textContent = 'ENTRANDO...';

    // Simulação de autenticação — substitua pela chamada real da API
    setTimeout(() => {
      const user = document.getElementById('userInput').value.trim();
      const pass = passInput.value.trim();
      if (user && pass.length >= 4) {
        loginBtn.textContent = 'BEM-VINDO!';
      } else {
        errorMsg.classList.add('show');
        loginBtn.classList.remove('loading');
        loginBtn.textContent = 'LOGIN';
      }
    }, 900);
  });
</script>

</body>
</html>
