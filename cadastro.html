<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michezo — Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --terracotta:#B85C3E;
    --terracotta-dark:#9C4A30;
    --ink:#211E19;
    --gray-txt:#8a8478;
    --border:#e2ddd2;
    --cream:#FBF9F5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:#fff;
    min-height:100vh;
  }
  .screen{
    display:grid;
    grid-template-columns:42% 58%;
    min-height:100vh;
  }

  /* ---------- left visual panel ---------- */
  .visual{
    position:relative;
    overflow:hidden;
    min-height:100vh;
  }
  .visual svg{width:100%; height:100%; display:block; position:absolute; inset:0;}
  .visual .quote{
    position:absolute; left:42px; bottom:38%;
    font-family:'Caveat', cursive; font-weight:600;
    font-size:clamp(26px, 2.6vw, 34px);
    color:#fff; line-height:1.35; max-width:340px;
    text-shadow:0 2px 10px rgba(0,0,0,.35);
    z-index:2;
  }

  /* ---------- right form panel ---------- */
  .form-panel{
    display:flex; align-items:center; justify-content:center;
    padding:64px 40px;
  }
  .form-inner{width:100%; max-width:460px;}
  .top-links{
    width:100%;
    display:flex;
    justify-content:flex-end;
    gap:20px;
    margin-bottom:25px;
    font-size:14px;
  }

.top-links a{
    text-decoration:none;
    color:#1c1a16;
    font-weight:600;
    transition:.3s;
}

.top-links a:hover{
    color:#bd5b34;
}

  .brand{text-align:center; margin-bottom:34px;}
  .brand .mark{width:64px; height:64px; margin:0 auto 6px;}
  .brand .word{
    font-family:'Anton', sans-serif; font-size:24px; letter-spacing:6px;
    color:var(--ink); margin-top:4px;
  }

  .field{margin-bottom:22px;}
  .field label{
    display:block; font-weight:700; font-size:15px; color:var(--ink); margin-bottom:10px;
  }
  .field input, .field select{
    width:100%; padding:16px 18px; border:1px solid var(--border); border-radius:8px;
    font-family:'Work Sans'; font-size:15px; color:var(--ink); outline:none;
    background:#fff; transition:border-color .15s ease, box-shadow .15s ease;
    appearance:none;
  }
  .field input::placeholder{color:#a19c8f;}
  .field input:focus, .field select:focus{
    border-color:var(--terracotta); box-shadow:0 0 0 3px rgba(184,92,62,.15);
  }
  .select-wrap{position:relative;}
  .select-wrap::after{
    content:''; position:absolute; right:20px; top:50%; transform:translateY(-50%);
    width:10px; height:10px; border-right:2px solid #6b6559; border-bottom:2px solid #6b6559;
    transform:translateY(-70%) rotate(45deg); pointer-events:none;
  }
  .select-wrap select{color:#a19c8f; cursor:pointer;}
  .select-wrap select.chosen{color:var(--ink);}

  .pw-wrap{position:relative;}
  .pw-toggle{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; color:#9a9385; font-size:13px; font-weight:600;
  }

  .submit-btn{
    width:100%; padding:18px; margin-top:6px;
    background:var(--terracotta); color:#fff; border:none; border-radius:30px;
    font-family:'Work Sans'; font-size:17px; font-weight:600; cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .submit-btn:hover{background:var(--terracotta-dark); transform:translateY(-1px);}
  .submit-btn:active{transform:translateY(0);}

  .links-row{
    display:flex; justify-content:center; gap:14px; margin-top:18px; flex-wrap:wrap;
  }
  .pill{
    background:var(--terracotta); color:#fff; border:none; border-radius:20px;
    padding:9px 22px; font-family:'Work Sans'; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:background .2s ease;
  }
  .pill:hover{background:var(--terracotta-dark);}
  .pill.ghost{background:transparent; color:var(--terracotta); border:1.5px solid var(--terracotta);}
  .pill.ghost:hover{background:rgba(184,92,62,.08);}

  .msg{
    text-align:center; font-size:13px; color:var(--gray-txt); margin-top:22px;
  }
  .msg a{color:var(--terracotta); font-weight:600;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:14px 22px; border-radius:8px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:all .35s ease; z-index:200;
    box-shadow:0 10px 26px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .error{color:var(--terracotta-dark); font-size:12.5px; margin-top:6px; display:none;}
  .field.invalid input, .field.invalid select{border-color:var(--terracotta-dark);}
  .field.invalid .error{display:block;}

  @media (max-width: 880px){
    .screen{grid-template-columns:1fr;}
    .visual{min-height:260px;}
    .visual .quote{bottom:16px; left:24px; font-size:22px;}
    .form-panel{padding:44px 24px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="screen">
  <div class="visual">
    <svg viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2A1C13"/>
          <stop offset="1" stop-color="#6B2E17"/>
        </linearGradient>
      </defs>
      <rect width="800" height="1400" fill="url(#bg)"/>
      <g opacity="0.95">
        <rect x="0" y="0" width="400" height="380" fill="#B4622F"/>
        <rect x="400" y="0" width="400" height="500" fill="#123B34"/>
        <rect x="0" y="380" width="400" height="420" fill="#1B1712"/>
        <rect x="400" y="500" width="400" height="500" fill="#8C3018"/>
        <rect x="0" y="800" width="400" height="600" fill="#C1442D"/>
        <rect x="400" y="1000" width="400" height="400" fill="#241C13"/>
      </g>
      <g stroke="#F2E9D3" stroke-width="8" fill="none" opacity="0.85">
        <path d="M40 140 L110 70 L180 140"/>
        <path d="M40 200 L110 130 L180 200"/>
        <path d="M460 900 L540 820 L620 900"/>
        <path d="M460 960 L540 880 L620 960"/>
        <path d="M50 1080 L120 1010 L190 1080"/>
      </g>
      <path d="M120 340 C 190 260 230 260 250 340 C 270 420 320 420 340 340" stroke="#F2E9D3" stroke-width="12" fill="none" opacity="0.9"/>
      <g fill="#F2E9D3" opacity="0.9">
        <circle cx="620" cy="120" r="14"/>
        <circle cx="660" cy="160" r="9"/>
        <circle cx="80" cy="60" r="10"/>
      </g>
      <g stroke="#0E0C08" stroke-width="7" fill="none" opacity="0.5">
        <path d="M100 950 l36 -36 36 36 -36 36 Z"/>
        <path d="M180 950 l36 -36 36 36 -36 36 Z"/>
        <path d="M260 950 l36 -36 36 36 -36 36 Z"/>
      </g>
      <!-- palm leaves overlay -->
      <g fill="#1F4A2B" opacity="0.95">
        <path d="M520 20 C 700 60 700 260 590 340 C 540 240 510 120 520 20 Z"/>
        <path d="M420 0 C 540 20 570 150 500 220 C 460 140 430 70 420 0 Z"/>
        <path d="M40 1180 C 140 1120 280 1130 320 1220 C 220 1270 80 1270 40 1180 Z"/>
        <path d="M120 1240 C 220 1200 340 1230 370 1320 C 270 1350 150 1340 120 1240 Z"/>
        <path d="M480 1060 C 560 990 680 990 750 1060 C 680 1110 560 1110 480 1060 Z"/>
      </g>
      <g fill="#2E6B3D" opacity="0.9">
        <path d="M600 40 C 680 100 660 240 570 280 C 550 190 550 110 600 40 Z"/>
        <path d="M20 1200 C 100 1150 200 1160 230 1240 C 150 1280 60 1270 20 1200 Z"/>
      </g>
      <!-- straw texture at bottom -->
      <g stroke="#C9A15A" stroke-width="5" opacity="0.5">
        <line x1="0" y1="1400" x2="60" y2="1220"/>
        <line x1="30" y1="1400" x2="100" y2="1200"/>
        <line x1="70" y1="1400" x2="140" y2="1230"/>
        <line x1="110" y1="1400" x2="180" y2="1210"/>
        <line x1="150" y1="1400" x2="220" y2="1240"/>
      </g>
    </svg>
    <div class="quote">A força da diversidade<br>em movimento.</div>
  </div>

  <div class="form-panel">
    <div class="form-inner">
       <div class="top-links">
          <a href="index.html">Início</a>
          <a href="login.html">Login</a>
          <a href="#">Esqueci a senha</a>
       </div>

      <div class="brand">
        <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
              <circle cx="2" cy="2" r="1" fill="#fff" opacity="0.5"/>
            </pattern>
          </defs>
          <path d="M10 10 L10 90 L28 90 L28 40 L50 68 L72 40 L72 90 L90 90 L90 10 L72 10 L50 42 L28 10 Z" fill="#1a1712"/>
          <path d="M10 10 L28 10 L28 40 L10 10 Z" fill="url(#dots)"/>
          <path d="M38 66 L50 80 L74 48 L67 42 L50 64 L44 57 Z" fill="#B85C3E"/>
        </svg>
        <div class="word">MICHEZO</div>
      </div>

      <form id="signupForm" novalidate>
        <div class="field" id="f-nome">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome completo" autocomplete="name">
          <div class="error">Digite seu nome completo.</div>
        </div>

        <div class="field" id="f-nasc">
          <label for="nasc">Data de nascimento</label>
          <input type="text" id="nasc" placeholder="DD/MM/AAAA" maxlength="10" autocomplete="bday">
          <div class="error">Use o formato DD/MM/AAAA.</div>
        </div>

        <div class="field" id="f-genero">
          <label for="genero">Gênero</label>
          <div class="select-wrap">
            <select id="genero">
              <option value="" selected disabled>Selecione seu gênero</option>
              <option value="feminino">Feminino</option>
              <option value="masculino">Masculino</option>
              <option value="outro">Outro</option>
              <option value="prefiro-nao-dizer">Prefiro não dizer</option>
            </select>
          </div>
          <div class="error">Selecione uma opção.</div>
        </div>

        <div class="field" id="f-contato">
          <label for="contato">Gmail ou número</label>
          <input type="text" id="contato" placeholder="Digite seu Gmail ou número" autocomplete="email">
          <div class="error">Digite um e-mail ou número válido.</div>
        </div>

        <div class="field" id="f-senha">
          <label for="senha">Digite senha</label>
          <div class="pw-wrap">
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="new-password">
            <button type="button" class="pw-toggle" id="pwToggle">mostrar</button>
          </div>
          <div class="error">A senha deve ter pelo menos 6 caracteres.</div>
        </div>

        <button type="submit" class="submit-btn">Cadastrar</button>

        <div class="links-row">
          <button type="button" class="pill ghost" id="forgotBtn">Esqueceu a senha?</button>
          <button type="button" class="pill" id="loginBtn">Login</button>
        </div>

        <p class="msg">Já tem uma conta? <a href="login.html" id="loginLink">Entrar</a></p>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast">Cadastro realizado com sucesso!</div>

<script>
  const form = document.getElementById('signupForm');
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // date auto-format DD/MM/AAAA
  const nasc = document.getElementById('nasc');
  nasc.addEventListener('input', () => {
    let v = nasc.value.replace(/\D/g,'').slice(0,8);
    if(v.length >= 5) v = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
    else if(v.length >= 3) v = v.slice(0,2)+'/'+v.slice(2);
    nasc.value = v;
  });

  // gender select styling once chosen
  const genero = document.getElementById('genero');
  genero.addEventListener('change', () => genero.classList.add('chosen'));

  // password show/hide
  const senha = document.getElementById('senha');
  const pwToggle = document.getElementById('pwToggle');
  pwToggle.addEventListener('click', () => {
    const isPw = senha.type === 'password';
    senha.type = isPw ? 'text' : 'password';
    pwToggle.textContent = isPw ? 'ocultar' : 'mostrar';
  });

  function setInvalid(id, invalid){
    document.getElementById(id).classList.toggle('invalid', invalid);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    const nome = document.getElementById('nome').value.trim();
    setInvalid('f-nome', nome.length < 2); if(nome.length < 2) valid = false;

    const nascVal = nasc.value.trim();
    const dateOk = /^\d{2}\/\d{2}\/\d{4}$/.test(nascVal);
    setInvalid('f-nasc', !dateOk); if(!dateOk) valid = false;

    const genOk = !!genero.value;
    setInvalid('f-genero', !genOk); if(!genOk) valid = false;

    const contato = document.getElementById('contato').value.trim();
    const contatoOk = contato.length > 3;
    setInvalid('f-contato', !contatoOk); if(!contatoOk) valid = false;

    const senhaOk = senha.value.length >= 6;
    setInvalid('f-senha', !senhaOk); if(!senhaOk) valid = false;

    if(valid){
      showToast('Cadastro realizado com sucesso!');
      form.reset();
      genero.classList.remove('chosen');
    } else {
      showToast('Verifique os campos destacados.');
    }
  });

  document.getElementById('forgotBtn').addEventListener('click', () => showToast('Enviaremos instruções para recuperar sua senha.'));
  document.getElementById('loginBtn').addEventListener('click', () => showToast('Redirecionando para o login...'));
  document.getElementById('loginLink').addEventListener('click', (e) => { e.preventDefault(); showToast('Redirecionando para o login...'); });
</script>

</body>
</html>
